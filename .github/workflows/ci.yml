name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Pull request number for a hash-pin verification run
        required: false
        type: string
      candidate_head:
        description: Expected pull request head commit
        required: false
        type: string
      candidate_base:
        description: Expected main commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_pr && format('refs/pull/{0}/merge', inputs.release_pr) || github.ref }}
      - uses: cachix/install-nix-action@v31.11.1
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
      - name: Check package and build candidate CLI archive
        env:
          SYSTEM: ${{ matrix.system }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_head }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.candidate_base }}
        run: python3 scripts/pipeline.py native --system "$SYSTEM"
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'pull_request' || inputs.release_pr != ''
        with:
          name: grit-${{ matrix.system }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release-candidate:
    if: github.event_name == 'pull_request' || inputs.release_pr != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_pr && format('refs/pull/{0}/merge', inputs.release_pr) || github.ref }}
      - name: Check chosen release version
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 scripts/pipeline.py release-candidate --base-ref "$BASE_REF"

  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - run: python3 scripts/pipeline.py evaluate
