name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L --keep-going --no-update-lock-file
      - run: nix flake check -L --keep-going --no-update-lock-file 'path:.?dir=qa'
      - run: nix build -L .#grit --no-update-lock-file
      - run: nix run .#grit --no-update-lock-file -- --version

  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake show --all-systems --no-update-lock-file
      - run: nix flake show --all-systems --no-update-lock-file 'path:.?dir=qa'
